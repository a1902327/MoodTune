<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MoodTone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/stylesheets/RegisterPage.css">
</head>

<body>
  <div class="register-container">
    <div class="register-box">
      <h2 class="register-title">Register with MoodTone</h2>

      <div id="error-message" style="display: none;"></div>

      <form action="/users/register" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
          <label for="username">Name</label>
          <input type="text" id="username" name="username" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
          <label for="password">Create Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Type your password here" required>
            <button type="button" id="togglePassword" class="password-toggle-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="eye-off-icon" style="display:none;">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div class="error-message" id="password-error"></div>
        </div>

                <!-- Date of Birth -->
        <div class="form-group">
          <label for="date_of_birth">Date of Birth</label>
          <input type="date" id="date_of_birth" name="date_of_birth" required>
        </div>

        <!-- Address -->
        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" placeholder="Enter your address" required>
        </div>

        <!-- Repeat Password -->
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
          <div class="error-message" id="confirm-password-error"></div>
        </div>

        <!-- Avatar Upload -->
        <div class="form-group">
          <label for="avatar">Upload Avatar</label>
          <input type="file" id="avatar" name="avatar" accept="image/*">
        </div>

        <button type="submit" class="register-button">Register</button>
      </form>
      <p class="login-link">
        Already have an account? <a href="/users/login">Login here!</a>
      </p>
    </div>
  </div>

  <script src="/javascripts/show-password.js"></script>
  <script src="/javascripts/register.js"></script>
</body>

</html>
