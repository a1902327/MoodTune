<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - MoodTune</title>
    <link rel="stylesheet" href="/stylesheets/Homepage.css">
    <link rel="stylesheet" href="/stylesheets/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header-glass">
        <!-- Your header content can remain here. Ensure it includes navigation. -->
        <div class="container">
            <!-- Example Header Structure -->
            <div class="title"><h1><a href="/">MoodTune</a></h1></div>
            <nav>
                <div class="nav-actions">
                     <div class="auth-buttons logged-in">
                        <a href="/profile.html" id="profile-btn">Profile</a>
                        <form action="/users/logout?_method=DELETE" method="POST" class="logout-form-wrapper">
                          <button type="submit" class="btn btn-primary">Logout</button>
                        </form>
                      </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Profile Details Section -->
        <section id="profile-details" class="profile-section glass-gradient">
            <div id="profile-card-loader" class="loader"></div>
            <div id="profile-card-content" style="display: none;">
                <div class="profile-header">
                    <img src="/images/default-avatar.png" alt="User Avatar" id="user-avatar" class="profile-avatar">
                    <h2 id="user-name" class="profile-name">Loading...</h2>
                </div>
                <div class="profile-info">
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <span id="user-email"></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-birthday-cake"></i>
                        <span id="user-dob"></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span id="user-address"></span>
                    </div>
                </div>
                <div class="profile-actions">
                    <button id="edit-profile-btn" class="btn btn-secondary">
                        <i class="fas fa-pencil-alt"></i> Edit Profile
                    </button>
                </div>
            </div>
        </section>

        <!-- FIX: Added the missing Saved Songs section -->
        <section id="saved-songs" class="profile-section glass-gradient">
            <h2 class="section-header">Saved Songs</h2>
            <div id="songs-loader" class="loader" style="display: none;"></div>
            <div id="saved-songs-list" class="saved-songs-container">
                <!-- Songs will be dynamically inserted here by profile.js -->
            </div>
            <p id="no-songs-message" class="search-message" style="display: none;">You haven't saved any songs yet.</p>
        </section>
        <!-- End of fix -->

    </main>

    <!-- Modal for Editing Profile -->
    <div id="edit-profile-modal" class="modal" style="display: none;">
        <div class="modal-content glass-gradient">
            <div class="modal-header">
                <h2>Edit Profile</h2>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <form id="edit-profile-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="edit-name">Username</label>
                    <input type="text" id="edit-name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="edit-dob">Date of Birth</label>
                    <input type="date" id="edit-dob" name="date_of_birth">
                </div>

                <div class="form-group">
                    <label for="edit-address">Address</label>
                    <input type="text" id="edit-address" name="address">
                </div>

                <div class="form-group">
                    <label for="edit-avatar">Change Avatar</label>
                    <input type="file" id="edit-avatar" name="avatar" accept="image/*">
                    <img id="avatar-preview" src="/images/default-avatar.png" alt="Avatar Preview" style="max-height: 100px; margin-top: 10px;">
                </div>

                <div class="form-actions">
                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 MoodTune. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts for functionality -->
    <script src="/javascripts/login-status.js"></script>
    <script src="/javascripts/profile.js"></script>
</body>

</html>
